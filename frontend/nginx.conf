server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fichiers statiques uniquement. /api ne doit jamais retomber sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tout /api/ est proxifié vers FastAPI, y compris /api/auth/login et /api/auth/register.
    # Le slash final de proxy_pass retire le préfixe /api.
    # /api/auth/login -> http://api:8000/auth/login
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
