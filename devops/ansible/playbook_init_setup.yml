---
- name: Premier deploiement P5 sur le serveur
  hosts: production
  become: true

  vars_files:
    - vault.yml

  vars:
    app_dir: /app/P5_predictions
    ci_registry_image: ghcr.io/aurelien77/p5-deployez-un-modele-de-machine-learning
    edge_network_name: edge-network

  tasks:
    - name: Installer git curl et le plugin Docker Compose
      apt:
        name:
          - git
          - curl
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Creer le dossier de l'application
      file:
        path: "{{ app_dir }}/devops"
        state: directory
        mode: "0755"

    - name: Copier docker-compose.prod.yml
      copy:
        src: ../../docker-compose.prod.yml
        dest: "{{ app_dir }}/devops/docker-compose.prod.yml"
        mode: "0644"

    - name: Generer le fichier .env.prod
      template:
        src: templates/env.prod.j2
        dest: "{{ app_dir }}/devops/.env.prod"
        mode: "0600"

    - name: Creer le reseau Docker edge-network s'il n'existe pas
      shell: |
        docker network inspect {{ edge_network_name }} >/dev/null 2>&1 || \
        docker network create {{ edge_network_name }}
      changed_when: false

    - name: Login GHCR
      shell: docker login ghcr.io -u {{ registry_user }} -p {{ registry_token }}
      no_log: true

    - name: Telecharger les images
      shell: |
        docker pull {{ ci_registry_image }}/api:latest
        docker pull {{ ci_registry_image }}/frontend:latest

    - name: Demarrer la stack
      shell: |
        cd {{ app_dir }} && \
        CI_REGISTRY_IMAGE={{ ci_registry_image }} \
        docker compose --env-file devops/.env.prod -f devops/docker-compose.prod.yml up -d
      environment:
        CI_REGISTRY_IMAGE: "{{ ci_registry_image }}"