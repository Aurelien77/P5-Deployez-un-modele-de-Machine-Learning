name: CI/CD Pipeline

on:
  push:
    branches:
      - Stagging
      - Main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api   # -> ghcr.io/<owner>/<repo>/api

jobs:

  # ============================================================
  # TESTS - STAGGING
  # ============================================================
  test:
    if: github.ref == 'refs/heads/Stagging'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: rh_predictions_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rh_predictions_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check project structure
        run: |
          echo "=== Répertoire courant ==="
          pwd
          echo ""
          echo "=== Racine du projet ==="
          ls -la
          echo ""
          echo "=== Fast_API ==="
          ls -la Fast_API
          echo ""
          echo "=== Tests ==="
          ls -la tests

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Fast_API/requirements.txt
          pip install pytest pytest-cov httpx

      - name: Check Python imports
        env:
          PYTHONPATH: .
        run: |
          echo "=== Version Python ==="
          python --version
          echo ""
          echo "=== Python path ==="
          python -c "import sys; print('\n'.join(sys.path))"
          echo ""
          echo "=== Import Fast_API ==="
          python -c "import Fast_API; print(Fast_API.__file__)"
          echo ""
          echo "=== Import Fast_API.app ==="
          python -c "from Fast_API.app import app; print('Import Fast_API.app OK')"

      - name: Check installed packages
        run: |
          python -m pip list
          python -c "import httpx; print('httpx OK')"
          python -c "import fastapi; print('FastAPI OK')"
          python -c "import sqlalchemy; print('SQLAlchemy OK')"

      - name: Run tests and coverage
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: mysecretpassword
          DB_NAME: rh_predictions_db
          PYTHONPATH: .
        run: |
          pytest tests/test_api.py \
            --cov=Fast_API \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Pytest Results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Coverage summary
        if: always()
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: mysecretpassword
          DB_NAME: rh_predictions_db
          PYTHONPATH: .
        run: |
          echo "## 📊 Rapport de couverture" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          python -m pytest tests/test_api.py \
            --cov=Fast_API \
            --cov-report=term-missing \
            --no-cov-on-fail 2>&1 | tail -n 30 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 30

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30


  # ============================================================
  # BUILD & PUSH - MAIN
  # Construit et pousse l'image à chaque push sur Main.
  # Ne déploie PAS encore : c'est le job "deploy" qui s'en charge,
  # et lui seul attend une validation manuelle.
  # ============================================================
  build-and-push:
    if: github.ref == 'refs/heads/Main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # nécessaire pour pousser sur ghcr.io

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # fourni automatiquement, pas de secret à créer

      - name: Set image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest


  # ============================================================
  # DEPLOY - MAIN (validation manuelle obligatoire)
  # Le job se met en PAUSE ici et affiche un bouton "Review deployments"
  # tant que l'environment "production" n'est pas approuvé.
  # Cf. Settings > Environments > production > Required reviewers
  # ============================================================
  deploy:
    if: github.ref == 'refs/heads/Main'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://predictions.1dream.art
    permissions:
      contents: read
      packages: read   # le GITHUB_TOKEN doit pouvoir lire le package pour le pull côté serveur

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python & Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts

      - name: Write vault password file
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass.txt

      - name: Run Ansible deploy
        working-directory: devops/ansible
        run: |
          ansible-playbook -i inventory/hosts.yml playbook_update.yml \
            --vault-password-file /tmp/vault_pass.txt \
            -e "ci_commit_sha=${{ needs.build-and-push.outputs.image_tag }}" \
            -e "registry_token=${{ secrets.GITHUB_TOKEN }}" \
            -e "registry_user=${{ github.actor }}"

      - name: Cleanup secrets
        if: always()
        run: rm -f /tmp/vault_pass.txt ~/.ssh/id_rsa