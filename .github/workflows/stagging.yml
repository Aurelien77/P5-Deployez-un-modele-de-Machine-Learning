name: CI/CD Pipeline

on:
  push:
    branches:
      - Stagging
      - Main

jobs:

  # ============================================================
  # TESTS - STAGGING
  # ============================================================
  test:
    if: github.ref == 'refs/heads/Stagging'
    runs-on: ubuntu-latest

    # Démarrage d'un service PostgreSQL pour les tests dans la CI
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: rh_predictions_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rh_predictions_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # ----------------------------------------------------------
      # 1. Récupération du projet
      # ----------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Installation de Python
      # ----------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # ----------------------------------------------------------
      # 3. Vérification de la structure du projet
      # ----------------------------------------------------------
      - name: Check project structure
        run: |
          echo "=== Répertoire courant ==="
          pwd

          echo ""
          echo "=== Racine du projet ==="
          ls -la

          echo ""
          echo "=== Fast_API ==="
          ls -la Fast_API

          echo ""
          echo "=== Tests ==="
          ls -la tests

      # ----------------------------------------------------------
      # 4. Installation des dépendances
      # ----------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Fast_API/requirements.txt
          pip install pytest pytest-cov httpx

      # ----------------------------------------------------------
      # 5. Vérification de Fast_API et des imports
      # ----------------------------------------------------------
      - name: Check Python imports
        env:
          PYTHONPATH: .
        run: |
          echo "=== Version Python ==="
          python --version

          echo ""
          echo "=== Python path ==="
          python -c "import sys; print('\n'.join(sys.path))"

          echo ""
          echo "=== Import Fast_API ==="
          python -c "import Fast_API; print(Fast_API.__file__)"

          echo ""
          echo "=== Import Fast_API.app ==="
          python -c "from Fast_API.app import app; print('Import Fast_API.app OK')"

      # ----------------------------------------------------------
      # 6. Vérification des dépendances
      # ----------------------------------------------------------
      - name: Check installed packages
        run: |
          python -m pip list
          python -c "import httpx; print('httpx OK')"
          python -c "import fastapi; print('FastAPI OK')"
          python -c "import sqlalchemy; print('SQLAlchemy OK')"

      # ----------------------------------------------------------
      # 7. Tests + couverture
      # ----------------------------------------------------------
      - name: Run tests and coverage
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: mysecretpassword
          DB_NAME: rh_predictions_db
          PYTHONPATH: .
        run: |
          pytest tests/test_api.py \
            --cov=Fast_API \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      # ----------------------------------------------------------
      # 8. Résultats des tests dans GitHub Actions
      # ----------------------------------------------------------
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Pytest Results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false

      # ----------------------------------------------------------
      # 9. Résumé de la couverture
      # ----------------------------------------------------------
      - name: Coverage summary
        if: always()
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: mysecretpassword
          DB_NAME: rh_predictions_db
          PYTHONPATH: .
        run: |
          echo "## 📊 Rapport de couverture" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY

          python -m pytest tests/test_api.py \
            --cov=Fast_API \
            --cov-report=term-missing \
            --no-cov-on-fail 2>&1 | tail -n 30 >> $GITHUB_STEP_SUMMARY

          echo '```' >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------
      # 10. Sauvegarde du rapport HTML
      # ----------------------------------------------------------
      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 30

      # ----------------------------------------------------------
      # 11. Sauvegarde du rapport XML
      # ----------------------------------------------------------
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

      # ----------------------------------------------------------
      # 12. Sauvegarde des résultats pytest
      # ----------------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30


  # ============================================================
  # DEPLOY - MAIN
  # ============================================================
  deploy:
    if: github.ref == 'refs/heads/Main'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display message
        run: echo "Déploiement OK Ready to next"