# =============================================================================
# GOLDEN PATH — pipeline CI/CD backend (+ images frontend)
# =============================================================================
#
# Interrupteurs : .github/golden-path.env
#   ENABLE_STAGING_TESTS=true|false
#   ENABLE_PRODUCTION_RELEASE=true|false
#
#   1. Tests (Stagging)
#      ENABLE_STAGING_TESTS=true  →  git push origin Stagging
#
#   2. Release (Main) après validation manuelle
#      ENABLE_PRODUCTION_RELEASE=true  →  git push origin Main
#      → build GHCR puis job deploy bloqué par l'environnement "production"
#
# Variables GitHub à configurer (Settings → Secrets and variables) :
#   secrets.GITHUB_TOKEN          — fourni automatiquement
#   secrets.SSH_PRIVATE_KEY       — clé SSH du serveur de prod
#   secrets.PROD_HOST             — IP / hostname du serveur
#   secrets.ANSIBLE_VAULT_PASSWORD
#
# Environnements GitHub à créer (Settings → Environments) :
#   - staging     : pas de reviewer (tests automatiques)
#   - production  : cocher "Required reviewers" (validation manuelle)
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - Stagging
      - Main
  # Permet à un développeur de lancer le golden path à la main
  # (Actions → CI/CD Pipeline → Run workflow)
  workflow_dispatch:
    inputs:
      activer_tests_staging:
        description: "Activer les tests (chemin Stagging)"
        type: boolean
        default: true
      activer_release_production:
        description: "Activer la release (chemin Main, validation manuelle)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:

  # ---------------------------------------------------------------------------
  # Lit .github/golden-path.env (le fichier où on change true/false)
  # ---------------------------------------------------------------------------
  flags:
    name: Lire les interrupteurs golden path
    runs-on: ubuntu-latest
    outputs:
      enable_staging_tests: ${{ steps.read.outputs.enable_staging_tests }}
      enable_production_release: ${{ steps.read.outputs.enable_production_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lire .github/golden-path.env
        id: read
        run: |
          echo "=== Contenu de .github/golden-path.env ==="
          cat .github/golden-path.env
          set -a
          # shellcheck disable=SC1091
          source .github/golden-path.env
          set +a
          echo "enable_staging_tests=${ENABLE_STAGING_TESTS:-false}" >> "$GITHUB_OUTPUT"
          echo "enable_production_release=${ENABLE_PRODUCTION_RELEASE:-false}" >> "$GITHUB_OUTPUT"
          echo "ENABLE_STAGING_TESTS=${ENABLE_STAGING_TESTS:-false}"
          echo "ENABLE_PRODUCTION_RELEASE=${ENABLE_PRODUCTION_RELEASE:-false}"

  # ---------------------------------------------------------------------------
  # Chemin 1 — Stagging : tests automatiques
  # ---------------------------------------------------------------------------
  test:
    name: Tests (golden path Stagging)
    needs: flags
    if: >
      needs.flags.outputs.enable_staging_tests == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/Stagging')
        ||
        (github.event_name == 'workflow_dispatch' &&
         github.event.inputs.activer_tests_staging == 'true')
      )
    runs-on: ubuntu-latest
    environment:
      name: staging

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: rh_predictions_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rh_predictions_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check project structure
        run: |
          echo "=== Répertoire courant ==="
          pwd
          echo ""
          echo "=== Racine du projet ==="
          ls -la
          echo ""
          echo "=== backend ==="
          ls -la backend
          echo ""
          echo "=== Tests ==="
          ls -la tests

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov httpx

      - name: Check Python imports
        env:
          PYTHONPATH: .
        run: |
          echo "=== Version Python ==="
          python --version
          echo ""
          echo "=== Python path ==="
          python -c "import sys; print('\\n'.join(sys.path))"
          echo ""
          echo "=== Import backend ==="
          python -c "import backend; print(backend.__file__)"
          echo ""
          echo "=== Import backend.app ==="
          python -c "from backend.app import app; print('Import backend.app OK')"

      - name: Check installed packages
        run: |
          python -m pip list
          python -c "import httpx; print('httpx OK')"
          python -c "import fastapi; print('FastAPI OK')"
          python -c "import sqlalchemy; print('SQLAlchemy OK')"

      - name: Run tests and coverage
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: mysecretpassword
          DB_NAME: rh_predictions_db
          PYTHONPATH: .
        run: |
          pytest tests/test_api.py \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Pytest Results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Coverage summary
        if: always()
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: mysecretpassword
          DB_NAME: rh_predictions_db
          PYTHONPATH: .
        run: |
          echo "## Rapport de couverture" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          python -m pytest tests/test_api.py \
            --cov=backend \
            --cov-report=term-missing \
            --no-cov-on-fail 2>&1 | tail -n 30 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 30

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Chemin 2 — Main : build + publication des images (avant validation)
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build images (golden path Main)
    needs: flags
    if: >
      needs.flags.outputs.enable_production_release == 'true' &&
      github.ref == 'refs/heads/Main' &&
      (
        github.event_name == 'push'
        ||
        (github.event_name == 'workflow_dispatch' &&
         github.event.inputs.activer_release_production == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: |
          repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image_api=${{ env.REGISTRY }}/${repo}/api" >> "$GITHUB_OUTPUT"
          echo "image_frontend=${{ env.REGISTRY }}/${repo}/frontend" >> "$GITHUB_OUTPUT"

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image_api }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_api }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.image_frontend }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_frontend }}:latest

  # ---------------------------------------------------------------------------
  # Chemin 2 (suite) — release production après validation manuelle
  # L'environnement GitHub "production" doit avoir "Required reviewers".
  # Tant que personne n'approuve, le job reste en attente (Review).
  # ---------------------------------------------------------------------------
  deploy:
    name: Release production (validation manuelle)
    needs: [flags, build-and-push]
    if: >
      needs.flags.outputs.enable_production_release == 'true' &&
      github.ref == 'refs/heads/Main' &&
      (
        github.event_name == 'push'
        ||
        (github.event_name == 'workflow_dispatch' &&
         github.event.inputs.activer_release_production == 'true')
      )
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://predictions.1dream.art
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python & Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts

      - name: Write vault password file
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass.txt

      - name: Run Ansible deploy
        working-directory: devops/ansible
        run: |
          ansible-playbook -i inventory/hosts.yml playbook_update.yml \
            --vault-password-file /tmp/vault_pass.txt \
            -e "ci_commit_sha=${{ needs.build-and-push.outputs.image_tag }}" \
            -e "registry_token=${{ secrets.GITHUB_TOKEN }}" \
            -e "registry_user=${{ github.actor }}"

      - name: Cleanup secrets
        if: always()
        run: rm -f /tmp/vault_pass.txt ~/.ssh/id_rsa
