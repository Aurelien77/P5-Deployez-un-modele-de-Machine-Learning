# =============================================================================
# GOLDEN PATH — pipeline CI/CD backend (+ images frontend)
# =============================================================================
#
# Interrupteurs : golden-path.env (racine du dépôt)
#   ENABLE_STAGING_TESTS=true|false
#   ENABLE_PRODUCTION_RELEASE=true|false
#   ENABLE_SEMANTIC_RELEASE=true|false
#
#   1. Tests (Stagging)
#      ENABLE_STAGING_TESTS=true  →  git push origin Stagging
#
#   2. Release (Main) après validation manuelle
#      ENABLE_PRODUCTION_RELEASE=true  →  git push origin Main
#      → build GHCR puis job deploy bloqué par l'environnement "production"
#
# Variables GitHub à configurer (Settings → Secrets and variables) :
#   secrets.GITHUB_TOKEN          — fourni automatiquement
#   secrets.SSH_PRIVATE_KEY       — clé SSH du serveur de prod
#   secrets.PROD_HOST             — IP / hostname du serveur
#   secrets.ANSIBLE_VAULT_PASSWORD
#
# Environnements GitHub à créer (Settings → Environments) :
#   - staging     : pas de reviewer (tests automatiques)
#   - production  : cocher "Required reviewers" (validation manuelle)
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - Stagging
      - Main
  # Permet à un développeur de lancer le golden path à la main
  # (Actions → CI/CD Pipeline → Run workflow)
  workflow_dispatch:
    inputs:
      activer_tests_staging:
        description: "Activer les tests (chemin Stagging)"
        type: boolean
        default: true
      activer_release_production:
        description: "Activer la release (chemin Main, validation manuelle)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:

  # ---------------------------------------------------------------------------
  # Lit golden-path.env à la racine (active / désactive les jobs ci-dessous)
  # ---------------------------------------------------------------------------
  flags:
    name: Lire golden-path.env
    runs-on: ubuntu-latest
    outputs:
      enable_staging_tests: ${{ steps.read.outputs.enable_staging_tests }}
      enable_production_release: ${{ steps.read.outputs.enable_production_release }}
      enable_semantic_release: ${{ steps.read.outputs.enable_semantic_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lire golden-path.env
        id: read
        run: |
          echo "=== Contenu de golden-path.env (racine) ==="
          cat golden-path.env
          set -a
          # shellcheck disable=SC1091
          source golden-path.env
          set +a
          echo "enable_staging_tests=${ENABLE_STAGING_TESTS:-false}" >> "$GITHUB_OUTPUT"
          echo "enable_production_release=${ENABLE_PRODUCTION_RELEASE:-false}" >> "$GITHUB_OUTPUT"
          echo "enable_semantic_release=${ENABLE_SEMANTIC_RELEASE:-false}" >> "$GITHUB_OUTPUT"
          echo "ENABLE_STAGING_TESTS=${ENABLE_STAGING_TESTS:-false}"
          echo "ENABLE_PRODUCTION_RELEASE=${ENABLE_PRODUCTION_RELEASE:-false}"
          echo "ENABLE_SEMANTIC_RELEASE=${ENABLE_SEMANTIC_RELEASE:-false}"

  # ---------------------------------------------------------------------------
  # Chemin 1 — Stagging : tests automatiques
  # ---------------------------------------------------------------------------
  test:
    name: Tests (golden path Stagging)
    needs: flags
    if: >
      needs.flags.outputs.enable_staging_tests == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/Stagging')
        ||
        (github.event_name == 'workflow_dispatch' &&
         github.event.inputs.activer_tests_staging == 'true')
      )
    runs-on: ubuntu-latest
    environment:
      name: staging

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: rh_predictions_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rh_predictions_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check project structure
        run: |
          echo "=== Répertoire courant ==="
          pwd
          echo ""
          echo "=== Racine du projet ==="
          ls -la
          echo ""
          echo "=== backend ==="
          ls -la backend
          echo ""
          echo "=== Tests ==="
          ls -la tests

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov httpx

      - name: Check Python imports
        env:
          PYTHONPATH: .
        run: |
          echo "=== Version Python ==="
          python --version
          echo ""
          echo "=== Python path ==="
          python -c "import sys; print('\\n'.join(sys.path))"
          echo ""
          echo "=== Import backend ==="
          python -c "import backend; print(backend.__file__)"
          echo ""
          echo "=== Import backend.app ==="
          python -c "from backend.app import app; print('Import backend.app OK')"

      - name: Check installed packages
        run: |
          python -m pip list
          python -c "import httpx; print('httpx OK')"
          python -c "import fastapi; print('FastAPI OK')"
          python -c "import sqlalchemy; print('SQLAlchemy OK')"

      - name: Run tests and coverage
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: mysecretpassword
          DB_NAME: rh_predictions_db
          PYTHONPATH: .
        run: |
          pytest tests/test_api.py \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Pytest Results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Coverage summary
        if: always()
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: mysecretpassword
          DB_NAME: rh_predictions_db
          PYTHONPATH: .
        run: |
          echo "## Rapport de couverture" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          python -m pytest tests/test_api.py \
            --cov=backend \
            --cov-report=term-missing \
            --no-cov-on-fail 2>&1 | tail -n 30 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 30

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Versionnement — UNIQUEMENT sur Stagging (après tests verts)
  # Artefact Actions : release-version  (version.txt + version-prod.txt)
  # Tag git          : vX.Y.Z-rc.N
  # ---------------------------------------------------------------------------
  version:
    name: Semantic Release (tags + artefact)
    needs: [flags, test]
    if: >
      always() &&
      !cancelled() &&
      needs.flags.outputs.enable_semantic_release == 'true' &&
      github.ref == 'refs/heads/Stagging' &&
      needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_version: ${{ steps.pack.outputs.staging_version }}
      prod_version: ${{ steps.pack.outputs.prod_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Semantic Release
        id: release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer l'artefact de version
        id: pack
        run: |
          mkdir -p version-artifact
          staging="${{ steps.release.outputs.new_release_version }}"
          if [ -z "$staging" ]; then
            staging="${{ steps.release.outputs.last_release_version }}"
          fi
          if [ -z "$staging" ]; then
            git fetch --tags origin
            staging=$(git tag -l 'v*' --sort=-v:refname | sed 's/^v//' | head -n 1)
          fi
          if [ -z "$staging" ]; then
            echo "Aucune version disponible (ni semantic-release, ni tag)."
            exit 1
          fi
          prod="${staging%%-rc*}"
          prod="${prod%%-RC*}"
          echo "$staging" > version-artifact/version.txt
          echo "$prod" > version-artifact/version-prod.txt
          echo "staging_version=${staging}" >> "$GITHUB_OUTPUT"
          echo "prod_version=${prod}" >> "$GITHUB_OUTPUT"
          echo "Version Stagging : ${staging}"
          echo "Version Main/prod : ${prod}"
          cat version-artifact/version.txt
          cat version-artifact/version-prod.txt

      - name: Publier l'artefact release-version
        uses: actions/upload-artifact@v4
        with:
          name: release-version
          path: version-artifact/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Build images — UNIQUEMENT sur Main
  # Récupère l'artefact release-version produit sur Stagging
  # (fallback : dernier tag git v* de origin/Stagging)
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build images (golden path Main)
    needs: flags
    if: >
      needs.flags.outputs.enable_production_release == 'true' &&
      github.ref == 'refs/heads/Main' &&
      (
        github.event_name == 'push'
        ||
        (github.event_name == 'workflow_dispatch' &&
         github.event.inputs.activer_release_production == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Récupérer l'artefact de version (dernier run Stagging)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p version-artifact
          echo "Recherche de l'artefact release-version sur Stagging..."
          mapfile -t RUN_IDS < <(gh run list \
            --branch Stagging \
            --workflow "CI/CD Pipeline" \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[].databaseId')
          found=0
          for run_id in "${RUN_IDS[@]:-}"; do
            echo "Tentative run ${run_id}..."
            if gh run download "$run_id" -n release-version --dir version-artifact 2>/dev/null; then
              echo "Artefact trouvé sur le run ${run_id}"
              found=1
              break
            fi
          done
          if [ "$found" != "1" ]; then
            echo "Pas d'artefact Actions. Fallback sur les tags git de Stagging."
            git fetch origin Stagging --tags --force
            last=$(git tag -l 'v*' --sort=-v:refname | sed 's/^v//' | head -n 1)
            if [ -z "$last" ]; then
              echo "Aucune version Stagging trouvée (ni artefact, ni tag)."
              echo "Pousse d'abord un versionnement sur Stagging."
              exit 1
            fi
            prod="${last%%-rc*}"
            echo "$last" > version-artifact/version.txt
            echo "$prod" > version-artifact/version-prod.txt
            echo "Version récupérée via tag : ${last}"
          fi
          echo "=== Contenu artefact ==="
          ls -la version-artifact
          cat version-artifact/version.txt
          cat version-artifact/version-prod.txt

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag depuis l'artefact Stagging
        id: meta
        run: |
          repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          staging=$(tr -d '[:space:]' < version-artifact/version.txt)
          prod=$(tr -d '[:space:]' < version-artifact/version-prod.txt)
          echo "image_tag=${prod}" >> "$GITHUB_OUTPUT"
          echo "staging_version=${staging}" >> "$GITHUB_OUTPUT"
          echo "image_api=${{ env.REGISTRY }}/${repo}/api" >> "$GITHUB_OUTPUT"
          echo "image_frontend=${{ env.REGISTRY }}/${repo}/frontend" >> "$GITHUB_OUTPUT"
          echo "Images taguées avec la version prod issue de Stagging : ${prod} (source ${staging})"

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image_api }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_api }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.image_frontend }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_frontend }}:latest

  # ---------------------------------------------------------------------------
  # Chemin 2 (suite) — release production après validation manuelle
  # L'environnement GitHub "production" doit avoir "Required reviewers".
  # Tant que personne n'approuve, le job reste en attente (Review).
  # ---------------------------------------------------------------------------
  deploy:
    name: Release production (validation manuelle)
    needs: [flags, build-and-push]
    if: >
      needs.flags.outputs.enable_production_release == 'true' &&
      github.ref == 'refs/heads/Main' &&
      (
        github.event_name == 'push'
        ||
        (github.event_name == 'workflow_dispatch' &&
         github.event.inputs.activer_release_production == 'true')
      )
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://predictions.1dream.art
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python & Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Même nom que devops/ansible/inventory/hosts.yml
          # ansible_ssh_private_key_file: ~/.ssh/deploy_p5_predictions
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_p5_predictions
          chmod 600 ~/.ssh/deploy_p5_predictions
          cp ~/.ssh/deploy_p5_predictions ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts
          ssh-keyscan -H "204.168.133.167" >> ~/.ssh/known_hosts || true

      - name: Write vault password file
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass.txt

      - name: Run Ansible deploy
        working-directory: devops/ansible
        run: |
          ansible-playbook -i inventory/hosts.yml playbook_update.yml \
            --vault-password-file /tmp/vault_pass.txt \
            -e "ci_commit_sha=${{ needs.build-and-push.outputs.image_tag }}" \
            -e "registry_token=${{ secrets.GITHUB_TOKEN }}" \
            -e "registry_user=${{ github.actor }}"

      - name: Cleanup secrets
        if: always()
        run: rm -f /tmp/vault_pass.txt ~/.ssh/id_rsa ~/.ssh/deploy_p5_predictions
